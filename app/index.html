<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ZAHR Pilote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" id="ati" href="icon.svg">
<meta name="theme-color" content="#0E1813">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZAHR Pilote">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0E1813;color:#F3F4EF;font:16px/1.5 Inter,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
a.b{display:inline-block;margin-top:14px;background:#8FB39D;color:#0E1813;border-radius:99px;padding:12px 26px;font-weight:600;text-decoration:none}
p{color:#C9D2CC;max-width:420px}
</style>
</head>
<body>
<main>
<img src="icon.svg" width="96" height="96" alt="Logo ZAHR">
<h1 style="margin:14px 0 4px;font-size:22px">ZAHR Pilote</h1>
<p id="t">Installe cette page comme application : sur iPhone, Partager puis « Sur l’écran d’accueil » ; sur PC, Edge, menu … puis Applications, « Installer ce site en tant qu’application ».</p>
<a class="b" href="https://claude.ai/artifact/5pPXTu2RzM7iDaVe728eWs">Ouvrir ZAHR Pilote</a>
</main>
<script>
// Icône PNG pour l'écran d'accueil de l'iPhone, dessinée à partir du logo
const im = new Image();
im.onload = () => { const c = document.createElement('canvas'); c.width = c.height = 180;
  const x = c.getContext('2d'); x.drawImage(im, 0, 0, 180, 180);
  try { document.getElementById('ati').href = c.toDataURL('image/png'); } catch (e) {} };
im.src = 'icon.svg';
const app = new URLSearchParams(location.search).has('app') || matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (app) { document.getElementById('t').textContent = 'Ouverture…'; location.replace('https://claude.ai/artifact/5pPXTu2RzM7iDaVe728eWs'); }
</script>
</body>
</html>
